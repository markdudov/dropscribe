name: Release

# Pushing a `v*.*.*` tag is the only thing that ships a build:
#
#   npm version 0.1.1 && git push --follow-tags
#
# `workflow_dispatch` runs the same two build jobs without publishing anything,
# which is how the pipeline gets exercised without creating a tag that then has
# to be deleted. Deleted tags are worse than they sound once anyone has fetched
# one. The full procedure, and what to do when a leg fails, is docs/releasing.md.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds BOTH Mac architectures from one checkout on one arm64 runner.
  macos:
    name: macOS (arm64 + x64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Not `--ignore-scripts` here, unlike ci.yml: this is the job that needs
      # the binaries, and `postinstall` fetching the host target is half of what
      # is required. It also downloads the Electron runtime, without which
      # electron-builder has nothing to package.
      - name: Install dependencies
        run: npm ci

      # The step whose absence ships an arm64 ffmpeg inside the Intel dmg.
      #
      # `fetch-binaries.mjs` with no argument fetches for the HOST, which is
      # right for `postinstall` and wrong here: this runner is arm64 and it
      # builds the Intel dmg too, from the same checkout. Without
      # `vendor/bin/darwin-x64/`, electron-builder's extraResources source is
      # simply missing — which it only WARNS about — and the Intel build ships
      # either no engines or, depending on how the glob resolves, the arm64 ones
      # under an x64 label.
      #
      # Nothing downstream catches it. `enginesReady()` answers "is the file
      # there", not "will this file execute on this CPU", and a wrong-arch
      # Mach-O answers yes to the first question. The first honest signal is
      # `posix_spawn` returning EBADARCH on an Intel Mac, at the end of the
      # audio-extraction stage of a user's first job. Naming both targets is
      # idempotent: the arm64 half is already on disk from `postinstall` and is
      # skipped by hash.
      - name: Fetch media binaries for both macOS architectures
        run: node scripts/fetch-binaries.mjs --target darwin-arm64 --target darwin-x64

      # The guard that would have caught bug 0002 before a user did. It runs the
      # binaries that are about to be packaged and asserts they still speak the
      # interface the adapters expect — the CLI flags, and at least one audio
      # encoder that `compressForUpload` can use. CI proper cannot do this: it
      # installs with `--ignore-scripts` and has no `vendor/bin` at all, so this
      # is the one machine in the pipeline where the check is meaningful.
      - name: Check the vendored binaries still speak the expected interface
        run: npm run binaries:check

      - name: Build renderer + main
        run: npm run build

      # Signed and notarized when the repository holds the credentials for it,
      # ad-hoc when it does not. The branch is here rather than in
      # electron-builder.yml because it is a fact about this repository's
      # secrets, not about how the app is built.
      #
      # WHAT EACH BRANCH GIVES A USER, because the difference is not academic:
      #
      #   ad-hoc          Gatekeeper refuses the first double-click with "Apple
      #                   could not verify…", and System Settings → Privacy &
      #                   Security → Open Anyway is the way through. The app is
      #                   attributable to nobody. `syspolicy_check distribution`
      #                   calls this "not suitable for distribution", and it is
      #                   right — it is what you ship when you have nothing
      #                   better, not what you ship when you have a certificate.
      #
      #   signed only     The same dialog. A Developer ID without a notarization
      #                   ticket buys attribution and nothing else; macOS 15
      #                   stopped treating it differently from ad-hoc. Set up
      #                   half of this and users see no improvement at all,
      #                   which is why the warning below is loud.
      #
      #   signed +        No dialog. This is the only combination that removes
      #   notarized       it, and the only reason to do any of this.
      #
      # `--config.mac.identity=` — deliberately empty — overrides the `-` in
      # electron-builder.yml, which is the right qualifier when there is no
      # certificate and the wrong one when there is: it is matched as a
      # substring against the identities in the keychain, so it finds a
      # Developer ID whose name happens to contain a hyphen and misses one that
      # does not. Empty means auto-discovery, which finds the certificate
      # CSC_LINK just imported whatever it is called. Verified against a real
      # Developer ID before this was written.
      #
      # Two credential shapes are supported because electron-builder supports
      # both, and the second is much less work to obtain: an app-specific
      # password from appleid.apple.com rather than an App Store Connect API
      # key from the developer portal. Whichever is present wins; the API key
      # is preferred when both are.
      #
      # `--publish never` because `electron-updater` is a dependency that is
      # deliberately not wired to a feed: an unsigned auto-update channel is
      # worse than none. The installers are attached to a GitHub release by the
      # publish job instead.
      #
      # `--arm64 --x64` on the command line rather than in electron-builder.yml,
      # so that a local `npm run pack` still builds only the host architecture
      # with the binaries `postinstall` actually fetched. The pairing that
      # matters is that this line and the fetch above name the same two.
      #
      # The `afterPack` hook (scripts/verify-packaged-binaries.mjs) runs inside
      # this command, once per produced app, and reads the Mach-O header of
      # every binary in the packaged `Resources/bin`. There is deliberately no
      # separate verification step: a gate that can be skipped by removing a
      # workflow step is not a gate.
      - name: Package
        # Every secret arrives under an IN_ name, and the real, magic name is
        # exported only once it has a value. That is not tidiness.
        #
        # A secret that does not exist reaches the step as an environment
        # variable set to the EMPTY STRING, not as an absent one. So `env:
        # CSC_LINK: ${{ secrets.CSC_LINK }}` on a repository with no certificate
        # hands electron-builder `CSC_LINK=''`, which it reads as "a certificate
        # path was configured", resolves against the working directory, and dies
        # with `⨯ /Users/runner/work/dropscribe/dropscribe not a file` — in the
        # ad-hoc branch, which is not supposed to involve a certificate at all.
        # The branch below was already choosing correctly; the variable simply
        # travelled past it. Found by a dispatch run, not by reasoning.
        env:
          IN_CSC_LINK: ${{ secrets.CSC_LINK }}
          IN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          IN_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          IN_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          IN_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          IN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          common=(--mac --arm64 --x64 --publish never)

          if [ -z "${IN_CSC_LINK:-}" ]; then
            echo '::notice::No CSC_LINK secret, so this build is ad-hoc signed. Users will meet Privacy & Security -> Open Anyway on first launch. docs/releasing.md says what to add to change that.'
            npx electron-builder "${common[@]}"
            exit 0
          fi

          export CSC_LINK="$IN_CSC_LINK"
          # An `if` and not `[ -n … ] && export`, which works only because bash
          # exempts every command but the last in an && list from `set -e`. It
          # is a rule that is easy to forget and expensive to rediscover.
          if [ -n "${IN_CSC_KEY_PASSWORD:-}" ]; then export CSC_KEY_PASSWORD="$IN_CSC_KEY_PASSWORD"; fi

          # Deliberately empty: it overrides the `-` in electron-builder.yml,
          # which is the right qualifier with no certificate and the wrong one
          # with a real one, because `-` is matched as a SUBSTRING against the
          # keychain — it finds a Developer ID whose name happens to contain a
          # hyphen and misses one that does not. Empty means auto-discovery,
          # which finds whatever CSC_LINK just imported, whatever it is called.
          signed=(--config.mac.identity=)

          if [ -n "${IN_APPLE_API_KEY:-}" ] && [ -n "${IN_APPLE_API_KEY_ID:-}" ] && [ -n "${IN_APPLE_API_ISSUER:-}" ]; then
            # electron-builder wants a PATH, not the key itself. RUNNER_TEMP is
            # wiped with the runner, and it is outside the workspace, so the key
            # cannot be swept up by an artifact glob.
            printf '%s' "$IN_APPLE_API_KEY" > "$RUNNER_TEMP/notary.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/notary.p8"
            export APPLE_API_KEY_ID="$IN_APPLE_API_KEY_ID"
            export APPLE_API_ISSUER="$IN_APPLE_API_ISSUER"
            echo '::notice::Signing with the Developer ID and notarizing with the App Store Connect key.'
            npx electron-builder "${common[@]}" "${signed[@]}" --config.mac.notarize=true
          elif [ -n "${IN_APPLE_ID:-}" ] && [ -n "${IN_APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${IN_APPLE_TEAM_ID:-}" ]; then
            export APPLE_ID="$IN_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$IN_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID="$IN_APPLE_TEAM_ID"
            echo '::notice::Signing with the Developer ID and notarizing with the app-specific password.'
            npx electron-builder "${common[@]}" "${signed[@]}" --config.mac.notarize=true
          else
            # A warning and not an error, because a half-finished signing setup
            # must not be the reason a release does not go out: this build is
            # still usable, and refusing to produce it would help nobody. It is
            # loud because the failure is otherwise invisible — the log says
            # "signing", and users meet the identical dialog they met before.
            echo '::warning::CSC_LINK is set but no notarization credentials are. This build is signed and NOT notarized, which looks exactly the same to a user as ad-hoc: macOS 15 shows the same dialog for both. Add either APPLE_API_KEY + APPLE_API_KEY_ID + APPLE_API_ISSUER, or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID.'
            npx electron-builder "${common[@]}" "${signed[@]}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: installers-macos
          path: |
            release/*.dmg
            release/*.zip
          # A silently empty artifact would reach the publish job and produce a
          # GitHub release with no installers attached to it, which is strictly
          # worse than a failed build: the tag would look shipped.
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Idempotent after `postinstall`, which already fetched this exact target
      # on this host. Written out anyway, so that both build jobs state the
      # binaries they need instead of one of them relying on a lifecycle script
      # that a future `--ignore-scripts` would quietly remove.
      #
      # There is one Windows architecture, so there is no second fetch here and
      # none of the ways the Mac job can go wrong.
      - name: Fetch media binaries
        run: node scripts/fetch-binaries.mjs --target win32-x64

      # The guard that would have caught bug 0002 before a user did. It runs the
      # binaries that are about to be packaged and asserts they still speak the
      # interface the adapters expect — the CLI flags, and at least one audio
      # encoder that `compressForUpload` can use. CI proper cannot do this: it
      # installs with `--ignore-scripts` and has no `vendor/bin` at all, so this
      # is the one machine in the pipeline where the check is meaningful.
      - name: Check the vendored binaries still speak the expected interface
        run: npm run binaries:check

      - name: Build renderer + main
        run: npm run build

      # Unsigned as well: Authenticode certificates cost money this project does
      # not spend yet. SmartScreen will show the blue "Windows protected your
      # PC" panel with no publisher name, and reputation accrues per binary, so
      # this does not improve as the project ages — every release starts from
      # zero. The release body tells users about More info → Run anyway.
      - name: Package (unsigned)
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: installers-windows
          path: release/*.exe
          if-no-files-found: error

  # Only for a real tag. A `workflow_dispatch` run stops after the two build
  # jobs with the installers attached to the run as artifacts — a complete dry
  # run of everything except the irreversible part.
  publish:
    name: GitHub release
    needs:
      - macos
      - windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # The one job that writes. The build jobs stay read-only.
      contents: write
    steps:
      - uses: actions/checkout@v7

      # RELEASE_NOTES.md is the release body verbatim, and the paragraphs about
      # the missing signature are the most important thing on the page: they are
      # what a user reads after macOS refuses to open the app. Rewriting this
      # file for a new version is a manual step in docs/releasing.md, and manual
      # steps get skipped — so the workflow refuses to publish notes that have
      # lost the warning rather than shipping a release whose only explanation
      # of the Gatekeeper dialog is a GitHub issue somebody files.
      #
      # It runs here, in the job that consumes the file, rather than as a fast
      # pre-flight: this is the only place the check can be a precondition of
      # the thing it protects.
      - name: Refuse to publish release notes without the unsigned-build warning
        run: |
          set -euo pipefail
          missing=0
          for phrase in 'not signed' 'Open Anyway' 'Run anyway' 'SmartScreen'; do
            if ! grep -qF "$phrase" RELEASE_NOTES.md; then
              echo "::error::RELEASE_NOTES.md no longer mentions '$phrase'"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo 'These builds are unsigned. The release body has to say so, and has to tell'
            echo 'macOS users about right-click → Open / System Settings → Privacy & Security →'
            echo 'Open Anyway, and Windows users about SmartScreen → More info → Run anyway.'
            echo 'docs/releasing.md carries the wording to paste back.'
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          # Both jobs' files land in one flat directory, which is the shape the
          # checksum step and the release upload both want.
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          # `nullglob` so a pattern that matches nothing disappears instead of
          # being passed to sha256sum as a literal `*.exe`.
          shopt -s nullglob
          files=(*.dmg *.zip *.exe)
          if [ "${#files[@]}" -eq 0 ]; then
            echo '::error::no installers were downloaded from the build jobs'
            exit 1
          fi
          # A published checksum from the same pipeline that built the file
          # proves nothing about the builder. It is still worth publishing: it
          # is what lets somebody who builds from the tag themselves check that
          # what they produced matches what was uploaded, which is the only
          # verification story an unsigned project honestly has.
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Is this a pre-release?
        id: kind
        run: |
          set -euo pipefail
          # `v0.2.0-rc.1` has a suffix, `v0.2.0` does not. A pre-release tag
          # produces a DRAFT: nothing is downloadable, and nothing is announced,
          # until a maintainer has installed it on both platforms and pressed
          # publish by hand.
          case "$GITHUB_REF_NAME" in
            *-*) echo 'prerelease=true' >> "$GITHUB_OUTPUT" ;;
            *)   echo 'prerelease=false' >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: softprops/action-gh-release@v3
        with:
          # The tag already exists — it is what triggered this run — so nothing
          # here creates one.
          tag_name: ${{ github.ref_name }}
          name: DropScribe ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS
          draft: ${{ steps.kind.outputs.prerelease == 'true' }}
          prerelease: ${{ steps.kind.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
